version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # termlib is a first-party fork consumed as a git submodule:
      # settings.gradle.kts includeBuild substitutes org.connectbot:termlib
      # with the local build, so a version bump here changes nothing built
      # and upstream releases don't track the fork.
      - dependency-name: "org.connectbot:termlib"

  # prns is an upstream-tracking submodule; its crate bumps arrive via
  # upstream trunk, but the detached abi/c workspace lockfile is watched so
  # advisories against its pinned graph surface here too.
  - package-ecosystem: cargo
    directory: /prns/prns-host/abi/c
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: gomod
    directory: /rclone-android/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
